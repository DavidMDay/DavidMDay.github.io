name: Compile LaTeX and Sync PDF

on:
  push:
    branches:
      - main

# Silences the Node 24 runner deprecation warnings sitewide
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true


jobs:
  build_latex:
    # This defines WHERE GitHub runs the workflow (on a cloud-hosted Linux server)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document via latexmk
        uses: xu-cheng/latex-action@v3
        with:
          # Point directly to your main .tex file name specified in your Makefile
          root_file: assets/translations/conical_shell.tex
          # Removed -g and -use-make to safely ignore missing bibliography files
          compiler: latexmk
          args: -pdf- -latexmkrc=none

      - name: Commit and Push Updated PDF
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'GitHub Action Bot'
          author_email: 'actions@github.com'
          message: 'chore: auto-compiled latest PDF via latexmk'
          add: 'assets/translations/conical_shell.pdf'

